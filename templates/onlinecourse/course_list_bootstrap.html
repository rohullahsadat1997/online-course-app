<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <h1 class="mb-4">Available Courses</h1>

        <div class="row">
            {% for course in course_list %}
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h2 class="h5">{{ course.name }}</h2>
                            <p class="text-muted">Published: {{ course.pub_date }}</p>
                            <a href="{% url 'onlinecourse:course_details' course.pk %}" class="btn btn-primary">
                                View Course
                            </a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p>No courses are available yet.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
